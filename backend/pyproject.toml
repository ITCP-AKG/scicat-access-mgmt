[project]
name = "scicat-access-mgmt-backend"
version = "0.1.0"
description = "Backend for SciCat Access Management — groups, membership, projection into SciCat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "motor>=3.4",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "mongomock-motor>=0.0.29",
    "ruff>=0.4",
    "black>=24.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
